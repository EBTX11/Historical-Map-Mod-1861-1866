  USA_je_1:0 "A House Divided"
  USA_je_1_reason:0 "The United States stand fractured, divided by irreconcilable differences over the future of the nation. What began as a political crisis has erupted into open conflict, as states take up arms either to preserve the Union or to secure their independence.\n\nBoth sides believe their cause to be just, and neither appears willing to yield. The outcome of this struggle will determine not only the fate of the Confederacy, but the very nature of the American nation itself.\n\nWill the Union be restored, or will a new nation rise from its ashes?"


  FRA_je_1_button_1:0 "Military Support"
  FRA_je_1_button_1_desc:0 "Provide troops and military aid to secure victory on the battlefield."
  FRA_je_1_button_1_tt_possible_1:0 "Nothing"
  FRA_je_1_button_1_tt_effect_1:0 "Increases government legitimacy"
  FRA_je_1_button_2:0 "Economic Support"
  FRA_je_1_button_2_desc:0 "Deliver financial aid and resources to sustain the war effort."
  FRA_je_1_button_2_tt_possible_1:0 "Nothing"
  FRA_je_1_button_2_tt_effect_1:0 "trengthens the army"
  FRA_je_1_button_3:0 "Political Support"
  FRA_je_1_button_3_desc:0 "Offer diplomatic backing to legitimize the regime and weaken opposition."
  FRA_je_1_button_3_tt_possible_1:0 "Nothing"
  FRA_je_1_button_3_tt_effect_1:0 "Receives a weekly subsidy of 10,000 francs from France"
  FRA_je_1_button_4:0 "Administrative Support"
  FRA_je_1_button_4_desc:0 "Assist in building stable institutions to govern and control the territory."
  FRA_je_1_button_4_tt_possible_1:0 "Nothing"
  FRA_je_1_button_4_tt_effect_1:0 "Stabilizes bureaucracy and reinforces state authority"

  FRA_je_1:0 "French intervention in Mexico"
  FRA_je_1_reason:0 "In the aftermath of the Civil War, the balance of power on the American continent remains fragile. Taking advantage of the United States’ temporary weakening, France, driven by Napoléon III, revives its imperial ambitions in the Americas.\n\nOfficially motivated by unpaid debts and the need to restore order, this new intervention conceals a far broader objective: to establish a lasting monarchical stronghold at the heart of Mexico, capable of counterbalancing the growing influence of the United States on the continent.\n\nThe project rests on the restoration of an imperial regime, embodied by Maximilien I of Mexico, whose legitimacy remains contested by the republican forces led by Benito Juárez. As French troops attempt to stabilize the country, local resistance intensifies, fueled by national sentiment and covertly sustained by American interests.\n\nAs the United States emerges strengthened from its civil war, tolerance for a European presence in the Americas diminishes. Faithful to the Monroe Doctrine, Washington may soon come to regard this intervention as a direct threat.\n\nFrance must now make a choice: become mired in a distant war to preserve its prestige and influence, or withdraw before the conflict escalates into open confrontation with a rising power."
  FRA_je_1_tt_complete_1:0 "France maintains the status quo during [GetGlobalVariable('FRA_je_1_global_variable_progress_bar_1').GetValue|D]/10 Years"
  FRA_je_1_1_progress_bar:0 "Progress Bar"
  FRA_je_1_1_progress_bar_desc:0 "1 Years of French rule in Mexico [GetGlobalVariable('FRA_je_1_global_variable_progress_bar_1').GetValue|D]/10 Years"
  FRA_je_1_tt_fail_1:0 "Mexico no longer controls any state, whether due to foreign occupation, revolt, or secession. Mexico currently controls [GetPlayer.MakeScope.ScriptValue('mexican_state_controlled_fra')|D] / [GetPlayer.MakeScope.ScriptValue('mexican_state_num_fra')|D] states."
  FRA_je_1_tt_on_fail_2:0 "Mexico becomes independent from France."



  MEX_je_1_tt_complete_1:0 "Imperial Longevity [GetGlobalVariable('MEX_je_1_global_variable_progress_bar_1').GetValue|D]/ 20"

  MEX_je_1:0 "The Precarious Crown of Mexico"
  MEX_je_1_reason:0 "Installed upon a throne far from his homeland, Maximilien Ier du Mexique reigns over an empire that exists more by foreign will than by national consent. Backed by the ambitions of Napoléon III, the Mexican crown stands—but on fragile foundations.\n\nBeneath the surface, unrest grows. Republican forces remain defiant, loyalties are divided, and the presence of foreign troops fuels resentment among the population. What was envisioned as a shining imperial project now risks becoming a costly and unstable entanglement.\n\nAs years pass, the illusion of stability may shatter. The crown endures—for now—but each decision will determine whether it is secured… or swept away."
  MEX_je_1_1_progress_bar:0 "Imperial Longevity"
  MEX_je_1_1_progress_bar_desc:0 "Imperial Longevity [GetGlobalVariable('MEX_je_1_global_variable_progress_bar_1').GetValue|D]/ 20"
  MEX_je_1_button_1:0 "Assert Sovereignty"
  MEX_je_1_button_1_desc:0 "In an effort to calm internal unrest and reinforce the image of an independent state, the imperial government publicly distances itself from French influence. While this may reassure parts of the population, it risks straining relations with France, upon which the Empire still heavily depends."
  MEX_je_1_button_1_tt_possible_1:0 "Nothing"
  MEX_je_1_button_1_tt_effect_1:0 "Nothing"

  USA_je_2_1_progress_bar:0 "Escalation with France"
  USA_je_2_1_progress_bar_desc:0 "Escalation with France [GetGlobalVariable('USA_je_2_global_variable_progress_bar_1').GetValue|D]/ 100"

  USA_je_2:0 "The Mexican Question"
  USA_je_2_reason:0 "The presence of a European-backed monarchy in Mexico stands as a direct challenge to American influence on the continent. As Napoléon III seeks to establish a lasting foothold through the rule of Maximilien Ier du Mexique, the United States cannot ignore the implications of foreign intervention so close to its borders.\n\nThough recent conflicts have limited immediate action, the foundations of American policy remain unchanged. The principles of the Doctrine Monroe demand that no external power impose its will upon the nations of the New World.\n\nAs tensions rise, public opinion hardens and political pressure mounts. Whether through diplomacy, covert support, or open confrontation, the United States may soon be compelled to act."

  USA_je_1_button_1:0 "Union's Initiative"
  USA_je_1_button_1_desc:0 "Seizing the initiative, we shall leverage our superior military might to reclaim the Confederacy state by state and restore the Union"
  USA_je_1_button_1_tt_possible_1:0 "Our military strength surpasses that of the Confederacy"
  USA_je_1_button_1_tt_possible_2:0 "Not is at War"
  USA_je_1_button_1_tt_effect_1:0 "The United States enters the war to reclaim the secessionist states and restore the Union"
  USA_je_1_button_2:0 "Confederacy's Initiative"
  USA_je_1_button_2_desc:0 "With our superior military strength, we shall secure the stability of our young nation and reclaim the states rightfully ours"
  USA_je_1_button_2_tt_possible_1:0 "Our military strength surpasses that of the Union"
  USA_je_1_button_2_tt_possible_2:0 "Not is at War"
  USA_je_1_button_2_tt_effect_1:0 "he Confederacy enters the war to secure the secessionist states, forge a new nation, and nullify all Union claims"
  USA_je_1_button_3:0 "The Confederacy ends the war"
  USA_je_1_button_3_desc:0 "The Confederacy brings the Civil War to an end."
  USA_je_1_button_3_tt_possible_1:0 "Fewer than two secessionist states remain."
  USA_je_1_button_3_tt_effect_1:0 "The Confederacy capitulates, and the remaining secessionist states rejoin the Union"
  USA_je_1_button_4:0 "Break the Truce"
  USA_je_1_button_4_desc:0 "The current peace is little more than a temporary pause in an inevitable confrontation. By deliberately escalating tensions and exploiting diplomatic pressure, the United States can undermine the legitimacy of existing agreements and hasten the end of the truce. Such actions, however, risk further destabilizing relations and bringing both nations closer to open conflict."
  USA_je_1_button_4_tt_possible_1:0 "Nothing"
  USA_je_1_button_4_tt_effect_1:0 "reduces peace to 24 months"
  USA_je_2_status_desc_1:0 "Diplomatic Balance"
  USA_je_2_status_desc_2:0 "Rising Tensions"
  USA_je_2_status_desc_3:0 "Crisis with France"
  USA_je_2_button_1:0 "Support Mexican Republicans"
  USA_je_2_button_1_desc:0 "Determined to uphold its influence in the Americas, the United States covertly supports the republican forces opposing the imperial regime in Mexico. By providing resources, intelligence, and diplomatic backing, Washington seeks to weaken the rule of Maximilien Ier du Mexique and hasten the collapse of the French-backed monarchy."
  USA_je_2_button_1_tt_possible_1:0 "A revolution is underway in Mexico"
  USA_je_2_button_1_tt_effect_1:0 "The USA will join all revolutionary wars against the Mexican Empire."
  USA_je_2_button_2:0 "Undermine the Mexican Empire"
  USA_je_2_button_2_desc:0 "Through covert operations, propaganda, and political interference, the United States works to destabilize the fragile Mexican Empire. These actions fuel unrest and deepen divisions within the country, gradually eroding the foundations of imperial authority."
  USA_je_2_button_2_tt_possible_1:0 "Nothing"
  USA_je_2_button_2_tt_effect_1:0 "Increases tensions with France by 5"
  USA_je_2_button_3:0 "Provoke the French Empire"
  USA_je_2_button_3_desc:0 "Openly condemning France’s presence in Mexico, the United States adopts an increasingly confrontational stance. Through diplomatic pressure, public denunciations, and deliberate provocations, Washington seeks to challenge French influence and escalate tensions between the two powers."
  USA_je_2_button_3_tt_possible_1:0 "Nothing"
  USA_je_2_button_3_tt_effect_1:0 "Increases tensions with France by 5"
  USA_je_2_button_4:0 "Intervene in Mexico"
  USA_je_2_button_4_desc:0 "The continued presence of French forces in Mexico has become intolerable. With tensions reaching a breaking point, the United States can no longer remain idle while a foreign power imposes its will upon the continent. Invoking the principles of the Doctrine Monroe, America prepares to act decisively to restore Mexican sovereignty—by force, if necessary."
  USA_je_2_button_4_tt_possible_1:0 "This is possible if France and the USA enter into a diplomatic crisis."
  USA_je_2_button_4_tt_effect_1:0 "The United States enters the war against France to restore Mexico’s independence"

  PRU_je_1:0 "By Iron and Blood"
  PRU_je_1_reason:0 "Prussia’s ambition to unify Germany through force now clashes with France’s determination to preserve the balance of power in Europe.\nBeneath mounting diplomatic tensions lies the prospect of an inevitable conflict: German unity or French supremacy.\nThe fate of the continent may soon be decided on the battlefield."
  PRU_je_1_status_desc_1:0 "Relations with France #green remain strained#!, but diplomacy still prevails."
  PRU_je_1_status_desc_2:0 "Diplomatic tensions with France are #gold escalating#!, and the prospect of conflict grows increasingly likely"
  PRU_je_1_status_desc_3:0 "War with France now appears #r inevitable#!. Both nations prepare for a decisive confrontation."
  PRU_je_1_1_progress_bar:0 "Tensions with France are steadily rising as diplomatic incidents and military preparations bring both nations closer to open conflict. [GetGlobalVariable('PRU_je_1_global_variable_progress_bar_1').GetValue|D]/ 300"
  PRU_je_1_1_progress_bar_desc:0 "Franco-Prussian Tensions [GetGlobalVariable('PRU_je_1_global_variable_progress_bar_1').GetValue|D]/ 300"
  PRU_je_1_button_1:0 "Publicly Humiliate France"
  PRU_je_1_button_1_desc:0 "France must be made to understand its place. A carefully crafted insult will inflame tensions and rally our nation behind the army. If war is to come, we will be ready."
  PRU_je_1_button_1_tt_possible_1:0 "Nothing"
  PRU_je_1_button_1_tt_effect_1:0 "Sends diplomatic insults to France, strengthening nationalist political factions"
  PRU_je_1_button_2:0 "Accelerate War Preparations"
  PRU_je_1_button_2_desc:0 "War is no longer a distant possibility. Our forces must be expanded, trained, and readied for immediate conflict."
  PRU_je_1_button_2_tt_possible_1:0 "Tenssion is under 150"
  PRU_je_1_button_2_tt_effect_1:0 "Increases the number of military barracks by 25"
  PRU_je_1_button_3:0 "Expand the Prussian Army"
  PRU_je_1_button_3_desc:0 "With tensions rising, Prussia must strengthen its armed forces. Expanding the army now will ensure readiness for the conflict to come."
  PRU_je_1_button_3_tt_possible_1:0 "Nothing"
  PRU_je_1_button_3_tt_effect_1:0 "Nothing"
  PRU_je_1_button_4:0 "Reassure Austria"
  PRU_je_1_button_4_desc:0 "Continued diplomatic efforts are required to preserve Austrian goodwill and ensure their neutrality in the coming conflict."
  PRU_je_1_button_4_tt_possible_1:0 "The Austro-Prussian War has ended"
  PRU_je_1_button_4_tt_effect_1:0 "Nothing"
  PRU_je_1_button_5:0 "Provoke War with France"
  PRU_je_1_button_5_desc:0 "The time has come to force a confrontation with France."
  PRU_je_1_button_5_tt_possible_1:0 "Tenssion is superior to 200"
  PRU_je_1_button_5_tt_effect_1:0 "Nothing"
  PRU_je_1_button_6:0 "Struggle for German Leadership"
  PRU_je_1_button_6_desc:0 "Prussia and Austria stand opposed in a निर्णcive struggle for control over the German states. A Prussian victory would end Austrian dominance and pave the way for a unified Germany under Prussian leadership."
  PRU_je_1_button_6_tt_possible_1:0 "Tenssion is superior to 100"
  PRU_je_1_button_6_tt_effect_1:0 "Nothing"

  AUS_je_1:0 "Accept the Hungarian Compromise"
  AUS_je_1_reason:0 "Our defeat against Prussia has severely weakened imperial authority. Hungary, though still under our control, now demands genuine autonomy. Refusing these demands risks fueling unrest and accelerating the Empire’s collapse. By accepting a compromise, we may preserve our power by transforming the Empire into a dual monarchy."
  AUS_je_1_button_1:0 "Accept the Hungarian Compromise"
  AUS_je_1_button_1_desc:0 ""
  AUS_je_1_button_1_tt_possible_1:0 "Nothing"
  AUS_je_1_button_1_tt_effect_1:0 "Nothing"

  ITA_je_1:0 "The Roman Question"
  ITA_je_1_reason:0 "Rome, the spiritual heart of Christendom and a symbol of our unfinished unity, remains beyond our control. As long as France protects the Holy See, any direct action would be perilous.\nYet if Paris is distracted by other conflicts, an opportunity may arise…\n\nBy steadily increasing pressure on the Papal States, we may prepare the way for our troops to enter the Eternal City and complete the unification of Italy."
  ITA_je_1_button_1:0 "Increase Pressure on Rome"
  ITA_je_1_button_1_desc:0 "Taking advantage of France’s distraction, we strengthen our military and political presence around Rome. Each move brings us closer to an inevitable confrontation."
  ITA_je_1_button_1_tt_possible_1:0 "Nothing"
  ITA_je_1_button_1_tt_effect_1:0 "Nothing"
  ITA_je_1_button_2:0 "Enter Rome"
  ITA_je_1_button_2_desc:0 "The time has come. France is absent, and Rome lies within our grasp. By breaching its walls, we shall complete the unification of Italy."
  ITA_je_1_button_2_tt_possible_1:0 "The pressure is greater than 90"
  ITA_je_1_button_2_tt_effect_1:0 "Nothing"
  ITA_je_1_1_progress_bar:0 "Progress Bar"
  ITA_je_1_1_progress_bar_desc:0 "Pressure on Rome: [GetGlobalVariable('ITA_je_1_global_variable_progress_bar_1').GetValue|D]/ 100"
  ITA_je_1_1_progress_bar_FRA_tt: "France is at war and its troops are mobilized outside of Rome."
  ITA_je_1_1_progress_bar_FRA_2_tt: "France is not at war and its troops are close to Rome and ready to intervene."
  ITA_je_1_status_desc_1:0 "Italian influence around #gold Rome#! is #green growing#!, though the situation remains contained."
  ITA_je_1_status_desc_2:0 "The situation in #gold Rome#! is #gold deteriorating#!. Diplomatic tensions are rising across Europe."
  ITA_je_1_status_desc_3:0 "The fate of #gold Rome#! hangs in the #r balance#!. A decisive move may soon be inevitable."

  JAP_je_1:0 "Proclamation of the Honorable Restoration"
  JAP_je_1_reason:0 "The authority of the Shogunate has waned, and the balance of power within the realm can no longer be sustained. Loyalist factions, court nobles, and reform-minded domains now rally around the Emperor, seeking to restore imperial rule and usher in a new era of centralized governance.\n\nWithout the need for open conflict, the foundations of the old order give way. The time has come to formally proclaim the restoration of imperial authority and bring an end to centuries of military rule under the Bakufu"
  JAP_je_1_button_1:0 "End of the Bakufu"
  JAP_je_1_button_1_desc:0 "Formally dissolve the Shogunate and restore full governing authority to the Emperor, marking the beginning of a new imperial era."
  JAP_je_1_button_1_tt_possible_1:0 "Nothing"
  JAP_je_1_button_1_tt_effect_1:0 "Nothing"
