l_english:
  treaty_treaty_of_the_triple_alliance:0 "Treaty of the Triple Alliance"
  BRZ_je_1:0 "War of the Triple Alliance"
  BRZ_je_1_reason:0 "The Rio de la Plata region has long been a stage for rival ambitions and fragile balances of power. The Empire of Brazil, determined to maintain its influence over Uruguay and contain its neighbors, watches with growing concern the rise of Paraguay under the leadership of Francisco Solano López.\n\nDriven by expansionist ambitions and unwilling to tolerate Brazilian interference in regional affairs, Paraguay appears ready to challenge the existing order in South America. The prospect of war now looms large, as alliances begin to take shape behind closed doors.\n\nShould conflict erupt, it will not be a mere border dispute, but a total war capable of reshaping the region for generations. The Empire must decide whether it is prepared to commit to a long and costly struggle to assert its dominance over the continent."
  BRZ_je_1_tt_1:0 "The War of the Triple Alliance is occurred."
  BRZ_je_1_button_1:0 "Alliance with Argentina"
  BRZ_je_1_button_1_desc:0 "Form an alliance with Argentina, in order to stop Paraguay's territorial ambitions"
  BRZ_je_1_button_1_tt_1:0 "Not has treaty defensive pact with Argentina"
  BRZ_je_1_button_1_tt_2:0 "Sign The Treaty of the Triple Alliance"
  BRZ_je_1_button_2:0 "Alliance with Uruguay"
  BRZ_je_1_button_2_desc:0 "Form an alliance with Uruguay, in order to stop Paraguay's territorial ambitions"
  BRZ_je_1_button_2_tt_1:0 "Not has treaty defensive pact with Uruguay"
  BRZ_je_1_button_2_tt_2:0 "nothin"
  BRZ_je_1_button_3:0 "We can beat them alone"
  BRZ_je_1_button_3_desc:0 "We are not forming any alliances with border allies to stop Paraguay's territorial ambitions."
  BRZ_je_1_button_3_tt_1:0 "No alliance with potential allies has been formed"
  BRZ_je_1_button_3_tt_2:0 "nothin"
  BRZ_je_1_button_4:0 "Alliance with Brazil"
  BRZ_je_1_button_4_desc:0 "Form an alliance with Brazil, in order to stop Paraguay's territorial ambitions"
  BRZ_je_1_button_4_tt_1:0 "Not has treaty defensive pact with Brazil"
  BRZ_je_1_button_4_tt_2:0 "nothin"
  BRZ_je_1_button_5:0 "Declare the Great War"
  BRZ_je_1_button_5_desc:0 "Declare war on your enemies"
  BRZ_je_1_button_5_tt_1:0 "The War of the Triple Alliance never occurred."
  BRZ_je_1_button_5_tt_2:0 "Neither Brazil, Argentina, nor Uruguay must hold a diplomatic pact such as a Defensive Pact or an alliance, or Paraguay must no longer hold any territorial claim on Brazil or Uruguay"
